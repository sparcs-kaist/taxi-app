name: Deploy iOS and Android App to App Store and Play Store
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, e.g. 1.0.5 (empty: use pubspec.yaml)"
        type: string
        required: false

env:
  FLUTTER_VERSION: "3"
  JAVA_VERSION: "17"

jobs:
  release-ios:
    name: Build and release iOS app
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Create .env
        run: |
          echo "FRONT_ADDRESS=https://taxi.sparcs.org" > .env
          echo "BACK_ADDRESS=https://taxi.sparcs.org" >> .env
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.2"
      - name: Create GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Install Fastlane
        run: cd ios && bundle install && cd ..
      - name: Install packages
        run: flutter pub get
      - name: Install pods
        run: cd ios && pod install && cd ..
      - name: Prebuild
        run: flutter build ios --release --no-codesign
      - name: Execute Fastlane command
        run: cd ios && fastlane release type:github
        timeout-minutes: 40
  release-android:
    name: Build Android app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create .env
        run: |
          echo "FRONT_ADDRESS=https://taxi.sparcs.org" > .env
          echo "BACK_ADDRESS=https://taxi.sparcs.org" >> .env
      - name: Create secret files
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEY_STORE" | base64 --decode > android/app/upload.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          {
            echo "UPLOAD_STORE_FILE=upload.keystore"
            echo "UPLOAD_STORE_PASSWORD=$UPLOAD_STORE_PASSWORD"
            echo "UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
            echo "UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
          } > android/key.properties
      - name: Install packages
        run: flutter pub get
      - name: Build app bundle
        id: build
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # versionCode: minutes since the Unix epoch, so it always increases and
          # never has to be bumped by hand.
          version_code=$(( $(date +%s) / 60 ))

          # versionName: manual run input, else the v* tag, else pubspec.yaml.
          version_name="${VERSION_NAME// /}"
          if [ -z "$version_name" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version_name" ]; then
            version_name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          fi
          if ! [[ "$version_name" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid version name '$version_name', expected something like 1.0.5"
            exit 1
          fi

          echo "Building versionName $version_name, versionCode $version_code"
          flutter build appbundle --release --build-name="$version_name" --build-number="$version_code"
          echo "artifact=taxi-$version_name-$version_code" >> "$GITHUB_OUTPUT"
          echo "### Android: $version_name ($version_code)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
