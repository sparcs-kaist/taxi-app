name: Deploy iOS and Android App to App Store and Play Store
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha
      version_name:
        description: "Version name, e.g. 1.0.5 (empty: use pubspec.yaml)"
        type: string
        required: false

env:
  FLUTTER_VERSION: "3"
  JAVA_VERSION: "17"

jobs:
  release-ios:
    name: Build and release iOS app
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Create .env
        run: |
          echo "FRONT_ADDRESS=https://taxi.sparcs.org" > .env
          echo "BACK_ADDRESS=https://taxi.sparcs.org" >> .env
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.2"
      - name: Create GoogleService-Info.plist
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Install Fastlane
        run: cd ios && bundle install && cd ..
      - name: Install packages
        run: flutter pub get
      - name: Install pods
        run: cd ios && pod install && cd ..
      - name: Prebuild
        run: flutter build ios --release --no-codesign
      - name: Execute Fastlane command
        run: cd ios && fastlane release type:github
        timeout-minutes: 40
  release-android:
    name: Build and release Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android
      - name: Create .env
        run: |
          echo "FRONT_ADDRESS=https://taxi.sparcs.org" > .env
          echo "BACK_ADDRESS=https://taxi.sparcs.org" >> .env
      - name: Create secret files
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_UPLOAD_GOOGLE_ACOUNT }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEY_STORE" | base64 --decode > android/app/upload.keystore
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > android/taxi-account.json
          {
            echo "UPLOAD_STORE_FILE=upload.keystore"
            echo "UPLOAD_STORE_PASSWORD=$UPLOAD_STORE_PASSWORD"
            echo "UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
            echo "UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
          } > android/key.properties
      - name: Install packages
        run: flutter pub get
      - name: Build and upload to Google Play
        working-directory: android
        env:
          PLAY_TRACK: ${{ inputs.track || 'alpha' }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: bundle exec fastlane release
